<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">OSINT Roadmap</title>
<desc id="desc">A method-first open source intelligence learning roadmap from framing a question to defensible intelligence.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#0b1730"/><stop offset="1" stop-color="#140d25"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity=".055"/></pattern>
<filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".35"/></filter>
<style>
.t{font:800 46px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;letter-spacing:1px}.s{font:500 18px Inter,Segoe UI,Arial,sans-serif;fill:#a5b4fc}
.k{font:800 13px Inter,Segoe UI,Arial,sans-serif;fill:#67e8f9;letter-spacing:2px}
.nt{font:800 20px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.nb{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
.x{font:700 11px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;letter-spacing:1px}
.st{font:800 15px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.sb{font:500 11px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
</style>
</defs>
<rect width="1600" height="1000" rx="28" fill="url(#bg)"/>
<rect x="18" y="18" width="1564" height="964" rx="24" fill="url(#grid)" stroke="#60a5fa" stroke-opacity=".18"/>

<text x="78" y="72" class="k">OPEN SOURCE INTELLIGENCE • METHOD-FIRST ROADMAP</text>
<text x="78" y="126" class="t">OSINT ROADMAP</text>
<text x="78" y="158" class="s">From a question → to evidence → to a defensible intelligence assessment.</text>

<g transform="translate(1335 55)">
<circle cx="70" cy="55" r="50" fill="#0e203f" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2"/>
<circle cx="70" cy="55" r="34" fill="none" stroke="#60a5fa" stroke-opacity=".35"/>
<circle cx="70" cy="55" r="18" fill="none" stroke="#c084fc" stroke-opacity=".35"/>
<path d="M20 55h100M70 5v100M34 19l72 72M106 19L34 91" stroke="#93c5fd" stroke-opacity=".14"/>
<circle cx="93" cy="34" r="5" fill="#67e8f9"/><circle cx="54" cy="76" r="4" fill="#c084fc"/><circle cx="83" cy="77" r="3" fill="#34d399"/>
<circle cx="70" cy="55" r="6" fill="#f8fafc"/>
</g>

<text x="78" y="214" class="k">THE CORE INVESTIGATION CYCLE</text>

<g filter="url(#shadow)">
<rect x="65" y="235" width="225" height="205" rx="18" fill="#0c1930" stroke="#22d3ee" stroke-opacity=".45"/>
<circle cx="96" cy="267" r="17" fill="#67e8f9"/><text x="96" y="271" text-anchor="middle" font-size="12" font-weight="900" fill="#082032">01</text>
<text x="122" y="274" class="nt">FRAME</text><text x="88" y="314" class="nb">Define the question</text><text x="88" y="336" class="nb">Set scope &amp; stop rules</text><text x="88" y="358" class="nb">Identify the starting clue</text><text x="88" y="404" class="x">QUESTION → SCOPE → PLAN</text>

<rect x="315" y="235" width="225" height="205" rx="18" fill="#0c1930" stroke="#60a5fa" stroke-opacity=".45"/>
<circle cx="346" cy="267" r="17" fill="#93c5fd"/><text x="346" y="271" text-anchor="middle" font-size="12" font-weight="900" fill="#082032">02</text>
<text x="372" y="274" class="nt">DISCOVER</text><text x="338" y="314" class="nb">Search &amp; collect leads</text><text x="338" y="336" class="nb">Archives &amp; public records</text><text x="338" y="358" class="nb">Names, domains, media</text><text x="338" y="404" class="x">LEAD ≠ EVIDENCE</text>

<rect x="565" y="235" width="225" height="205" rx="18" fill="#0c1930" stroke="#818cf8" stroke-opacity=".5"/>
<circle cx="596" cy="267" r="17" fill="#a5b4fc"/><text x="596" y="271" text-anchor="middle" font-size="12" font-weight="900" fill="#082032">03</text>
<text x="622" y="274" class="nt">VERIFY</text><text x="588" y="314" class="nb">Check provenance</text><text x="588" y="336" class="nb">Corroborate independently</text><text x="588" y="358" class="nb">Normalize context &amp; dates</text><text x="588" y="404" class="x">SOURCE → CLAIM → PROOF</text>

<rect x="815" y="235" width="225" height="205" rx="18" fill="#0c1930" stroke="#c084fc" stroke-opacity=".5"/>
<circle cx="846" cy="267" r="17" fill="#d8b4fe"/><text x="846" y="271" text-anchor="middle" font-size="12" font-weight="900" fill="#082032">04</text>
<text x="872" y="274" class="nt">CORRELATE</text><text x="838" y="314" class="nb">Join entities &amp; timelines</text><text x="838" y="336" class="nb">Test competing hypotheses</text><text x="838" y="358" class="nb">Map relationships &amp; gaps</text><text x="838" y="404" class="x">SIGNALS → CONTEXT</text>

<rect x="1065" y="235" width="225" height="205" rx="18" fill="#0c1930" stroke="#f0abfc" stroke-opacity=".45"/>
<circle cx="1096" cy="267" r="17" fill="#f5d0fe"/><text x="1096" y="271" text-anchor="middle" font-size="12" font-weight="900" fill="#082032">05</text>
<text x="1122" y="274" class="nt">ASSESS</text><text x="1088" y="314" class="nb">Calibrate confidence</text><text x="1088" y="336" class="nb">State uncertainty &amp; limits</text><text x="1088" y="358" class="nb">Separate fact / inference</text><text x="1088" y="404" class="x">FACT → INFERENCE → JUDGMENT</text>

<rect x="1315" y="235" width="220" height="205" rx="18" fill="#0c1930" stroke="#34d399" stroke-opacity=".5"/>
<circle cx="1346" cy="267" r="17" fill="#6ee7b7"/><text x="1346" y="271" text-anchor="middle" font-size="12" font-weight="900" fill="#082032">06</text>
<text x="1372" y="274" class="nt">REPORT</text><text x="1338" y="314" class="nb">Evidence table + source log</text><text x="1338" y="336" class="nb">Reproducible research note</text><text x="1338" y="358" class="nb">Conclusion + caveats</text><text x="1338" y="404" class="x">OUTPUT → REVIEW</text>
</g>

<!-- connectors -->
<g stroke="url(#line)" stroke-width="3" fill="none" stroke-opacity=".55">
<path d="M290 338h25M540 338h25M790 338h25M1040 338h25M1290 338h25"/>
<path d="M1425 440v115c0 44-60 80-125 80H190c-62 0-125-36-125-80V440"/>
</g>

<text x="78" y="515" class="k">WHAT YOU SHOULD BE ABLE TO PRODUCE</text>
<g transform="translate(65 540)">
<rect x="0" y="0" width="1470" height="78" rx="16" fill="#091426" stroke="#60a5fa" stroke-opacity=".2"/>
<rect x="24" y="21" width="150" height="36" rx="18" fill="#13294a"/><text x="99" y="44" text-anchor="middle" class="x">RESEARCH QUESTION</text>
<text x="194" y="45" class="nb">→</text>
<rect x="232" y="21" width="132" height="36" rx="18" fill="#182a4f"/><text x="298" y="44" text-anchor="middle" class="x">SOURCE LOG</text>
<text x="385" y="45" class="nb">→</text>
<rect x="453" y="21" width="170" height="36" rx="18" fill="#222b57"/><text x="538" y="44" text-anchor="middle" class="x">VERIFIED CLAIMS</text>
<text x="644" y="45" class="nb">→</text>
<rect x="674" y="21" width="175" height="36" rx="18" fill="#2e275e"/><text x="761" y="44" text-anchor="middle" class="x">ANALYTICAL JUDGMENT</text>
<text x="870" y="45" class="nb">→</text>
<rect x="895" y="21" width="267" height="36" rx="18" fill="#123d3b"/><text x="1028" y="44" text-anchor="middle" class="x">REPRODUCIBLE ASSESSMENT</text>
<text x="1180" y="45" class="nb">→</text>
<rect x="1210" y="21" width="232" height="36" rx="18" fill="#163a34"/><text x="1326" y="44" text-anchor="middle" class="x">CLEAR LIMITATIONS</text>
</g>

<text x="78" y="675" class="k">SPECIALIZE AFTER THE CORE METHOD</text>
<g filter="url(#shadow)">
<g transform="translate(65 700)">
<rect width="230" height="112" rx="16" fill="#0c1930" stroke="#60a5fa" stroke-opacity=".25"/><text x="18" y="34" class="st">CTI</text><text x="18" y="57" class="sb">PIRs • IOCs • infrastructure</text><text x="18" y="78" class="sb">ATT&amp;CK • timelines • assessment</text>
<rect x="250" width="230" height="112" rx="16" fill="#0c1930" stroke="#60a5fa" stroke-opacity=".25"/><text x="18" y="34" class="st" transform="translate(250 0)">DIGITAL FOOTPRINT</text><text x="268" y="57" class="sb">Identifiers • attribution • archives</text><text x="268" y="78" class="sb">Privacy-minimized research</text>
<rect x="500" width="230" height="112" rx="16" fill="#0c1930" stroke="#818cf8" stroke-opacity=".25"/><text x="518" y="34" class="st">GEOINT &amp; VISUAL</text><text x="518" y="57" class="sb">Geolocation • chronolocation</text><text x="518" y="78" class="sb">Maps • imagery • verification</text>
<rect x="750" width="230" height="112" rx="16" fill="#0c1930" stroke="#c084fc" stroke-opacity=".25"/><text x="768" y="34" class="st">COMPANY RESEARCH</text><text x="768" y="57" class="sb">Entities • ownership • filings</text><text x="768" y="78" class="sb">Corporate relationships</text>
<rect x="1000" width="230" height="112" rx="16" fill="#0c1930" stroke="#f0abfc" stroke-opacity=".25"/><text x="1018" y="34" class="st">MEDIA VERIFICATION</text><text x="1018" y="57" class="sb">Claims • provenance • source chains</text><text x="1018" y="78" class="sb">Image • video • news</text>
<rect x="1250" width="285" height="112" rx="16" fill="#0c1930" stroke="#34d399" stroke-opacity=".25"/><text x="1268" y="34" class="st">PUBLIC WEB RESEARCH</text><text x="1268" y="57" class="sb">Domains • infrastructure • records</text><text x="1268" y="78" class="sb">Passive, lawful collection</text>
</g>
</g>

<rect x="65" y="855" width="1470" height="82" rx="18" fill="#091426" stroke="#22d3ee" stroke-opacity=".23"/>
<text x="90" y="887" class="k">FIELD RULE</text>
<text x="90" y="914" class="nt">A tool can find a lead. Only evidence can support a conclusion.</text>
<text x="1225" y="900" class="x">LEARN • PRACTICE • VERIFY • DOCUMENT</text>
</svg>