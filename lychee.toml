max_redirects = 10
max_retries = 2
retry_wait_time = 2
# 401/403 often mean the site is reachable but blocks automated checkers.
accept = [200, 206, 401, 403, 429]
include_mail = false
include_verbatim = false
exclude_loopback = true
exclude_private = true
user_agent = "Mozilla/5.0 (compatible; OSINT-Roadmap link checker; +https://github.com/imedkablavi/OSINT-Roadmap)"

exclude = [
  '^https://localhost',
  '^http://localhost',
  '^mailto:',
  '^tel:',
  # Known automation-unfriendly / transient service.
  '^https://crt\.sh/?',
  # GitHub Pages is not live until repository Pages is enabled once.
  '^https://imedkablavi\.github\.io/OSINT-Roadmap/tool-finder\.html$'
]
