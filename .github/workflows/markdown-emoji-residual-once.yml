name: Residual Markdown emoji cleanup
on:
  push:
    branches: ['docs/markdown-symbol-cleanup']
    paths: ['.github/.markdown-emoji-residual-trigger']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Remove residual emoji from Markdown
        run: |
          python - <<'PY'
          from pathlib import Path
          chars = ('⭐','⭕','〰','〽','㊗','㊙')
          for p in Path('.').rglob('*.md'):
              if '.git' in p.parts: continue
              s = p.read_text(encoding='utf-8')
              n = s
              for ch in chars:
                  n = n.replace(ch, '')
              if n != s:
                  p.write_text(n, encoding='utf-8')
          PY
      - name: Commit and self-remove
        run: |
          rm -f .github/workflows/markdown-emoji-residual-once.yml .github/.markdown-emoji-residual-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: remove remaining emoji from Markdown'
          git push
