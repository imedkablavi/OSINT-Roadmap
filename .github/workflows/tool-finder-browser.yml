name: Interactive Site Browser Test

on:
  pull_request:
    paths:
      - 'site/tool-finder.html'
      - 'site/search.html'
      - 'site/tools.json'
      - 'site/tool-review.json'
      - 'site/style.css'
      - '**/*.md'
      - 'scripts/build_search_index.py'
      - 'tests/tool-finder.spec.js'
      - 'tests/search.spec.js'
      - 'tests/tool-finder-preview.spec.js'
      - 'playwright.config.js'
      - '.github/workflows/tool-finder-browser.yml'
  push:
    branches: [main]
    paths:
      - 'site/tool-finder.html'
      - 'site/search.html'
      - 'site/tools.json'
      - 'site/tool-review.json'
      - 'site/style.css'
      - '**/*.md'
      - 'scripts/build_search_index.py'
      - 'tests/tool-finder.spec.js'
      - 'tests/search.spec.js'
      - 'tests/tool-finder-preview.spec.js'
      - 'playwright.config.js'
      - '.github/workflows/tool-finder-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    name: Chromium interactive site E2E
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build full-content search index
        run: python scripts/build_search_index.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.62.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run interactive browser tests
        run: npx playwright test tests/tool-finder.spec.js tests/search.spec.js --reporter=line

      - name: Capture real Tool Finder preview
        run: npx playwright test tests/tool-finder-preview.spec.js --reporter=line

      - name: Upload Tool Finder preview
        uses: actions/upload-artifact@v7
        with:
          name: tool-finder-preview
          path: preview-artifact/tool-finder-preview.png
          retention-days: 7
          if-no-files-found: error
