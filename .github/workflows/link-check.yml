name: Link Health

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'site/**/*.html'
      - 'site/**/*.css'
      - 'site/**/*.xml'
      - 'site/**/*.txt'
      - '.github/workflows/link-check.yml'
      - 'lychee.toml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'site/**/*.html'
      - 'site/**/*.css'
      - 'site/**/*.xml'
      - 'site/**/*.txt'
      - '.github/workflows/link-check.yml'
      - 'lychee.toml'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check documentation and site links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --config lychee.toml
            --no-progress
            './**/*.md'
            './site/**/*.html'
            './site/**/*.css'
            './site/**/*.xml'
            './site/**/*.txt'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
