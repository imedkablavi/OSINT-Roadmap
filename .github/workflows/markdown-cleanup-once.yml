name: One-time Markdown cleanup
on:
  push:
    branches: ['docs/markdown-symbol-cleanup']
    paths: ['.github/.markdown-cleanup-trigger']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Clean Markdown only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          emoji=re.compile(r'[\U0001F1E6-\U0001F1FF\U0001F300-\U0001FAFF\u2600-\u27BF]')
          for p in Path('.').rglob('*.md'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              n=emoji.sub('',s.replace('—','-')).replace('\ufe0f','').replace('\u200d','').replace('\u20e3','')
              if n!=s: p.write_text(n,encoding='utf-8')
          PY
      - name: Commit and self-remove
        run: |
          rm -f .github/workflows/markdown-cleanup-once.yml .github/.markdown-cleanup-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: remove emoji and em dash from Markdown'
          git push
