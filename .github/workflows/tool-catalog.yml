name: Tool Catalogue

on:
  pull_request:
    paths:
      - 'site/tools.json'
      - 'site/tools-specialist.json'
      - 'site/tool-trust.json'
      - 'scripts/validate_tool_catalog.py'
      - '.github/workflows/tool-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'site/tools.json'
      - 'site/tools-specialist.json'
      - 'site/tool-trust.json'
      - 'scripts/validate_tool_catalog.py'
      - '.github/workflows/tool-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate tool catalogue
        run: python scripts/validate_tool_catalog.py