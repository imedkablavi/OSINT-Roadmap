name: Lighthouse

on:
  pull_request:
    paths:
      - 'site/**'
      - '**/*.md'
      - 'scripts/build_search_index.py'
      - 'lighthouserc.cjs'
      - '.github/workflows/lighthouse.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '**/*.md'
      - 'scripts/build_search_index.py'
      - 'lighthouserc.cjs'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse quality budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build full-content search index
        run: python scripts/build_search_index.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Lighthouse CI
        run: npm install --no-save --no-audit --no-fund @lhci/cli@0.15.1

      - name: Show Chrome version
        run: google-chrome --version

      - name: Run Lighthouse budgets
        run: npx lhci autorun --config=lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          retention-days: 7
          if-no-files-found: warn
