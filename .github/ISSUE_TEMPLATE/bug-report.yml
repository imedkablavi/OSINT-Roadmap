name: Bug report
description: Report a reproducible problem in the website, search, Tool Finder, docs, or automation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping keep OSINT Roadmap reliable. Please include only public/non-sensitive examples.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - GitHub Pages / routes
        - Tool Finder
        - Search
        - Documentation
        - Translation / RTL
        - CI / workflows
        - Other
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected URL or file
      placeholder: https://imedkablavi.github.io/OSINT-Roadmap/...
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include exact steps and the result you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, language/route, mobile or desktop
